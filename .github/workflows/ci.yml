name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-examples:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example:
          - AppKitExampleApp
          - MarkdownShowcase
          - MinimalAIApp
          - MinimalStreamingDemo
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.example }}
        working-directory: Examples/${{ matrix.example }}
        run: swift build
